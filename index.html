<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A mobile-first NFC digital business card template."
    />
    <title>NFC Digital Business Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" aria-labelledby="profile-name">
      <section class="profile" aria-label="Profile">
        <div class="profile-mark" aria-hidden="true">LOGO</div>
        <p class="eyebrow">NFC DIGITAL CARD</p>
        <h1 id="profile-name">Your Name</h1>
        <p class="role">Your Profession</p>
        <p class="intro">
          Add your short introduction here. Keep it clear, friendly, and easy to
          read on a phone.
        </p>
      </section>

      <nav class="links" aria-label="Contact links">
        <a class="link-button" href="#address">Address / Google Maps</a>
        <a class="link-button" href="#whatsapp">WhatsApp</a>
        <a class="link-button" href="#instagram">Instagram</a>
        <a class="link-button" href="#call">Call</a>
        <a class="link-button" href="#email">Email</a>
        <a class="link-button" href="#linkedin">LinkedIn</a>
        <a class="link-button link-button-primary" href="#save-contact">
          Save Contact
        </a>
      </nav>

      <footer class="footer">
        <p>Replace the placeholders with your details when ready.</p>
      </footer>
    </main>
  </body>
</html>
